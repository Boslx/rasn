[package]
name = "oracle"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: `fuzzing` is a separate workspace and must not pick this up.
[workspace]

[dependencies]
rasn = { path = "../.." }
afl = { version = "0.18", optional = true }

[build-dependencies]
cc = "1"

[features]
afl = ["dep:afl"]

[[bin]]
name = "decode"
path = "src/bin/decode.rs"
required-features = ["afl"]

[[bin]]
name = "encode"
path = "src/bin/encode.rs"
required-features = ["afl"]
